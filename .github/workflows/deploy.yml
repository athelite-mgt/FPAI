name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must already be provisioned by the infra workflow)
        required: true
        type: choice
        default: prod
        options: [dev, test, prod]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

permissions:
  id-token: write
  contents: read

# Required repository variables:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID — from the GitHub OIDC app
#   registration, same as infra.yml.
# Infrastructure (resource group FPAI_<environment>, App Service, SQL, Storage) must already
# exist — run the "Provision Azure Infrastructure" workflow first.
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA for ${{ inputs.environment }}
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The API serves the SPA from wwwroot, so one App Service hosts both and there is
      # no cross-origin request in production.
      - name: Stage the SPA inside the API
        run: |
          rm -rf backend/src/FpaiConnect.Api/wwwroot
          mkdir -p backend/src/FpaiConnect.Api/wwwroot
          cp -r frontend/dist/* backend/src/FpaiConnect.Api/wwwroot/

      - name: Publish API for ${{ inputs.environment }}
        working-directory: backend
        run: dotnet publish src/FpaiConnect.Api -c Release -o ../publish

      - name: Login to Azure using OIDC - ${{ inputs.environment }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Look up the web app name for ${{ inputs.environment }}
        id: webapp
        run: |
          name=$(az webapp list --resource-group "FPAI_${{ inputs.environment }}" \
                   --query "[0].name" -o tsv)
          if [ -z "$name" ]; then
            echo "No web app found in FPAI_${{ inputs.environment }} — run the infra workflow first." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Deploy the application - ${{ inputs.environment }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.webapp.outputs.name }}
          package: publish

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://${{ steps.webapp.outputs.name }}.azurewebsites.net/api/health"; then
              echo "Deployment is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "The deployed app did not become healthy."
          exit 1
